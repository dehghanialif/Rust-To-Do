version: '3.9'
services:
  backend:
    build:
      context: ./rust
    container_name: rust-backend
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: nextjs-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
    depends_on:
      - backend
